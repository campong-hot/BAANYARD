# BAANYARD static site — HTTP only inside the container.
# Public URL: https://campong.online/projects/baanyard/
# TLS, HTTP→HTTPS, and HSTS terminate on the campong.online host reverse proxy.
# Do not publish this container's 80 to the public internet.
# Camera/getUserMedia requires the public origin to be HTTPS (host TLS).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Avoid stale ES modules (cached utils.js + new chains.js → "does not provide an export named …").
    location ~* ^/projects/baanyard/.*\.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location = / {
        return 302 /projects/baanyard/;
    }

    location = /projects/baanyard {
        return 301 /projects/baanyard/;
    }

    # Option B: same public path inside the container as on campong.online.
    # Host proxy should pass the URI unchanged:
    #   location /projects/baanyard/ { proxy_pass http://127.0.0.1:8502; }
    location /projects/baanyard/ {
        try_files $uri $uri/ =404;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }
}
