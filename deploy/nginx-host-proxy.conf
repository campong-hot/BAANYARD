# Snippet for campong.online host nginx (TLS already on this host).
# HTTP → HTTPS: keep the existing `return 301 https://$host$request_uri;` on :80.
# HSTS: keep the existing add_header on the :443 server.
# Include these locations next to /projects/picklung/.
#
# Canonical: https://campong.online/projects/baanyard/

location = /projects/baanyard {
    return 301 /projects/baanyard/;
}
location /projects/baanyard/ {
    proxy_pass http://127.0.0.1:8502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
