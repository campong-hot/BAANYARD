# BAANYARD static demo on campong.online.
# Canonical: https://campong.online/projects/baanyard/
# Host nginx (80/443 + Let's Encrypt) proxies /projects/baanyard/ → 127.0.0.1:8502.
# TLS is not in this compose file.

services:
  baanyard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:80"
